<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DANAGO Pay makes secure digital payments simple." />
    <title>DANAGO Pay</title>
  </head>
  <body style="margin: 0; background: #f4f7f6; color: #102a2e; font-family: Arial, Helvetica, sans-serif;">
    <main style="min-height: 100vh; display: flex; flex-direction: column;">
      <header style="width: min(1120px, calc(100% - 40px)); margin: 0 auto; padding: 28px 0; display: flex; align-items: center; justify-content: space-between; gap: 24px;">
        <a href="/" style="color: #102a2e; font-size: 20px; font-weight: 800; letter-spacing: -0.04em; text-decoration: none;">DANAGO <span style="color: #087f6b;">Pay</span></a>
        <span style="padding: 8px 12px; border: 1px solid #b8ccc7; border-radius: 999px; color: #315c55; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;">Secure by design</span>
      </header>

      <section style="width: min(1120px, calc(100% - 40px)); margin: auto; padding: 72px 0 96px; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); align-items: center; gap: 64px;">
        <div>
          <p style="margin: 0 0 20px; color: #087f6b; font-size: 13px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase;">Payments that keep pace</p>
          <h1 style="max-width: 680px; margin: 0; font-size: clamp(48px, 8vw, 92px); line-height: 0.95; letter-spacing: -0.065em;">Move money.<br />Move forward.</h1>
          <p style="max-width: 560px; margin: 32px 0 0; color: #48645f; font-size: 18px; line-height: 1.7;">A straightforward way to send, receive, and manage digital payments with confidence. Built for everyday momentum.</p>
        </div>

        <aside style="background: #102a2e; border-radius: 28px; padding: clamp(28px, 5vw, 48px); color: #ffffff; box-shadow: 0 24px 64px rgba(16, 42, 46, 0.16);">
          <div style="display: flex; justify-content: space-between; align-items: center; gap: 16px;">
            <span style="font-size: 14px; color: #b9d3ce;">Available balance</span>
            <span style="width: 11px; height: 11px; border-radius: 50%; background: #39c6a8;"></span>
          </div>
          <p style="margin: 28px 0 48px; font-size: clamp(42px, 6vw, 64px); font-weight: 700; letter-spacing: -0.05em;">$24,860<span style="color: #79a29a;">.00</span></p>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <div style="padding: 18px; border: 1px solid #355156; border-radius: 16px;">
              <div style="color: #b9d3ce; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em;">Sent</div>
              <strong style="display: block; margin-top: 10px; font-size: 20px;">$3,240</strong>
            </div>
            <div style="padding: 18px; border: 1px solid #355156; border-radius: 16px;">
              <div style="color: #b9d3ce; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em;">Received</div>
              <strong style="display: block; margin-top: 10px; font-size: 20px; color: #6ee1c8;">$8,920</strong>
            </div>
          </div>
        </aside>
      </section>

      <footer style="width: min(1120px, calc(100% - 40px)); margin: 0 auto; padding: 24px 0 32px; border-top: 1px solid #d6e1df; color: #617a75; font-size: 13px;">Fast. Clear. Ready when you are.</footer>
    </main>
  </body>
</html>
